<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
    <rect width="40" height="40" rx="8" fill="#1C6EA4" />
    <!-- Outer Precision Dial -->
    <circle cx="20" cy="20" r="15" stroke="#FFFFFF" stroke-width="2.4" fill="none" />

    <!-- Concentric Radar Ring -->
    <circle
        cx="20"
        cy="20"
        r="9.5"
        stroke="#FFFFFF"
        stroke-width="1.4"
        stroke-dasharray="2.2 2.2"
        opacity="0.7"
        fill="none"
    />

    <!-- Cardinal Navigation Ticks -->
    <line x1="20" y1="5" x2="20" y2="9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="20" y1="31" x2="20" y2="35" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="5" y1="20" x2="9" y2="20" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="31" y1="20" x2="35" y2="20" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

    <!-- Radar Sweep / Hour Hand -->
    <line x1="20" y1="20" x2="28.3" y2="11.7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Precision Target Hub -->
    <circle cx="20" cy="20" r="2.75" fill="#FFFFFF" />
</svg>
